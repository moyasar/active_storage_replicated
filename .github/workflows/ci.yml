name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      RUBY_VERSION: 3.4.6
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: 3.4.6
            gemfile: Gemfile
          - ruby: 3.3.4
            gemfile: gemfiles/rails_7_2.gemfile
          - ruby: 3.4.6
            gemfile: gemfiles/puma_6.gemfile
          - ruby: 3.4.6
            gemfile: gemfiles/puma_7.gemfile

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      s3_primary:
        image: adobe/s3mock:latest
        ports:
          - 19090:9090

      s3_replica:
        image: adobe/s3mock:latest
        ports:
          - 19091:9090

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Point the real S3 tests at the two endpoints
        run: |
          cat > test/s3_endpoints.yml <<'YAML'
          primary: http://127.0.0.1:19090
          replica: http://127.0.0.1:19091
          access_key_id: devkey
          secret_access_key: devsecret123
          YAML

      - name: Wait for the S3 endpoints
        run: |
          for port in 19090 19091; do
            for attempt in $(seq 1 30); do
              curl -s -o /dev/null "http://127.0.0.1:${port}" && break
              sleep 2
            done
          done

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test
